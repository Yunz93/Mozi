[package]
name = "app"
version = "2.3.2"
description = "墨知 / Mozi — local-first Markdown knowledge-base editor (markdown-press)"
authors = ["Yunz93"]
license = "Apache-2.0"
repository = "https://github.com/Yunz93/Mozi"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[workspace]
members = ["crates/vault-watch"]
resolver = "2"

[features]
default = []
# Automation is opt-in and must never be enabled by a release workflow.
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
mozi-vault-watch = { path = "crates/vault-watch" }
base64 = "0.22"
chrono = "0.4"
iana-time-zone = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
chacha20poly1305 = "0.10"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
log = "0.4"
dirs = "6"
# Linux 的 URI 适配与此版本绑定，升级时同时检查 sidebar.rs 的 gtk_drag_path。
drag = "=2.1.1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
urlencoding = "2.1.3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
minisign-verify = "0.2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSObject"] }
