name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public content guard
        run: npm run check:public

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test CI helpers and desktop harness guards
        run: npm run test:ci

      - name: Release workflow smoke gate
        run: npm run smoke:release-workflow

      - name: Coverage gate
        run: npm run test:coverage

      - name: Upload full-source coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Retrieval eval gate
        run: npm run test:retrieval-eval

      - name: Build
        run: npm run build

  rust-tests:
    name: rust-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run cargo tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  linux-package:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: linux-package
      - name: Install Linux build and package validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils
      - run: npm ci
      - name: Build the Linux release package
        run: npm run tauri -- build --bundles deb --no-sign
      - name: Validate Debian metadata and installed launcher targets
        run: node scripts/check-linux-package.mjs
      - name: Run the application Rust tests on Linux
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p app --lib --features tauri/custom-protocol

  native-watch:
    name: native-watch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Test real native file events without a GUI
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p mozi-vault-watch
      - name: Repeat Windows overflow recovery regression
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml -p mozi-vault-watch --test native real_burst_is_replayed_or_requests_a_snapshot -- --exact || exit 1
          done
      - name: Measure native broker smoke workload
        shell: bash
        run: cargo run --locked --release --manifest-path src-tauri/Cargo.toml -p mozi-vault-watch --example observation_perf -- --counts 100 --windows 1 --rounds 3 > native-watch-perf.json
      - name: Upload native broker measurements
        uses: actions/upload-artifact@v4
        with:
          name: native-watch-perf-${{ matrix.os }}
          path: native-watch-perf.json

  ci-gate:
    name: CI gates
    if: always()
    needs: [frontend-checks, rust-tests, linux-package, native-watch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Require all CI results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/workflow-gate.mjs ci
