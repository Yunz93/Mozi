name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "补齐既有版本的 macOS 发布文件，例如 v2.3.6-beta.1"
        required: true
        type: string
      release_channel:
        description: "默认 beta 验证；正式补包必须选择 stable，且与标签匹配"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      build_runner:
        description: "构建环境；local-once 需要提前授权并注册一次性本机 runner"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - local-once

permissions:
  contents: write

jobs:
  release-channel:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      release_name: ${{ steps.channel.outputs.release_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
      - name: Resolve and validate release channel
        id: channel
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || '' }}
        run: node scripts/release-channel.mjs

  build-macos:
    needs: [release-channel]
    environment: TAURI
    permissions:
      contents: write
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.build_runner == 'local-once' && fromJSON('["self-hosted","macOS","ARM64","mozi-release-once"]') || fromJSON('["macos-15"]') }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Check one-shot local signing scope
        if: inputs.build_runner == 'local-once'
        shell: bash
        run: |
          if [[ -n "${APPLE_CERTIFICATE:-}" || -n "${APPLE_API_KEY_CONTENT:-}" ]]; then
            echo "::error::本机一次性 runner 不处理 Apple 证书或公证私钥，请使用托管 runner。"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
          cache: ${{ inputs.build_runner != 'local-once' && 'npm' || '' }}
          package-manager-cache: ${{ inputs.build_runner != 'local-once' }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 固定 stable

      - name: Cache Rust build artifacts
        if: inputs.build_runner != 'local-once'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # 固定 v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Release workflow smoke gate
        run: npm run smoke:release-workflow

      - name: Config parity and release parity gates
        run: npm test -- src/utils/tauriWindowConfig.test.ts src/utils/releaseParity.test.ts src/utils/releaseSmokeAuto.test.ts src/utils/installMacosScript.test.ts src/utils/macosReleaseSigning.test.ts src/utils/prepareTauriSigningKey.test.ts

      - name: Sync app version from Git tag
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: npm run release:sync-version

      - name: Prepare updater signing key
        id: prepare_signing_key
        env:
          TAURI_SIGNING_PRIVATE_KEY_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-tauri-signing-key.mjs

      # Tauri 2.x corrupts key decoding when TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set
      # to an empty string (Invalid symbol at ~offset 346). Only export a real password.
      - name: Export updater signing password
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF"
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Import Apple Developer certificate
        if: inputs.build_runner != 'local-once' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/import-apple-certificate.sh

      - name: Prepare Apple notarization credentials
        if: inputs.build_runner != 'local-once'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/prepare-apple-notarization.mjs

      - name: Compose release body
        id: release_body
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "body<<MARKDOWN_EOF"
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-body.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # 固定 v0
        env:
          MOZI_APTABASE_APP_KEY: ${{ secrets.MOZI_APTABASE_APP_KEY || vars.MOZI_APTABASE_APP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ needs.release-channel.outputs.release_name }}
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.release-channel.outputs.prerelease == 'true' }}
          assetNamePattern: Mozi_[version]_[arch][setup][ext]
          args: --bundles app,dmg

  build-windows:
    needs: [release-channel]
    environment: TAURI
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 固定 stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # 固定 v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Release workflow smoke gate
        run: npm run smoke:release-workflow

      - name: Config parity and release parity gates
        run: npm test -- src/utils/tauriWindowConfig.test.ts src/utils/releaseParity.test.ts src/utils/releaseSmokeAuto.test.ts src/utils/installMacosScript.test.ts src/utils/macosReleaseSigning.test.ts src/utils/prepareTauriSigningKey.test.ts

      - name: Sync app version from Git tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:sync-version

      - name: Prepare updater signing key
        id: prepare_signing_key
        env:
          TAURI_SIGNING_PRIVATE_KEY_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-tauri-signing-key.mjs

      # Tauri 2.x corrupts key decoding when TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set
      # to an empty string (Invalid symbol at ~offset 346). Only export a real password.
      - name: Export updater signing password
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF"
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Compose release body
        id: release_body
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "body<<MARKDOWN_EOF"
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-body.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # 固定 v0
        env:
          MOZI_APTABASE_APP_KEY: ${{ secrets.MOZI_APTABASE_APP_KEY || vars.MOZI_APTABASE_APP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ needs.release-channel.outputs.release_name }}
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.release-channel.outputs.prerelease == 'true' }}
          assetNamePattern: Mozi_[version]_[arch][setup][ext]
          args: --bundles nsis

  build-linux:
    environment: TAURI
    if: github.event_name != 'workflow_dispatch'
    needs: [release-channel, build-macos, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 固定 stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # 固定 v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: linux-package

      - name: Install Linux build and package validation dependencies
        run: |
          sudo "$(command -v node)" scripts/ci/configure-ubuntu-apt.mjs
          sudo apt-get update --error-on=any
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Release workflow smoke gate
        run: npm run smoke:release-workflow

      - name: Sync app version from Git tag
        run: npm run release:sync-version

      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-tauri-signing-key.mjs

      - name: Export updater signing password
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF"
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_INPUT}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the Linux release package
        env:
          MOZI_APTABASE_APP_KEY: ${{ secrets.MOZI_APTABASE_APP_KEY || vars.MOZI_APTABASE_APP_KEY }}
        run: npm run tauri -- build --bundles deb

      - name: Validate Debian metadata and installed launcher targets
        run: node scripts/check-linux-package.mjs

      - name: Upload validated Linux package to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          asset="Mozi_${RELEASE_TAG#v}_amd64.deb"
          cp "${packages[0]}" "$asset"
          cp "${packages[0]}.sig" "$asset.sig"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sig" --clobber --repo "$GITHUB_REPOSITORY"
          manifest_dir="$RUNNER_TEMP/mozi-linux-updater"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$manifest_dir" --repo "$GITHUB_REPOSITORY"
          node scripts/prepare-linux-updater.mjs "$manifest_dir/latest.json" "$asset"
          gh release upload "$RELEASE_TAG" "$manifest_dir/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

  verify-published-assets:
    if: github.event_name != 'workflow_dispatch'
    needs: [release-channel, build-macos, build-windows, build-linux]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 固定 stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # 固定 v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: linux-package
      - name: Install verifier build dependencies
        run: |
          sudo "$(command -v node)" scripts/ci/configure-ubuntu-apt.mjs
          sudo apt-get update --error-on=any
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Download published assets and verify metadata and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verification_dir=$(mktemp -d "$RUNNER_TEMP/mozi-release-verification.XXXXXX")
          echo "RELEASE_VERIFICATION_DIR=$verification_dir" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$verification_dir/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verification_dir"
          node scripts/ci/verify-release-assets.mjs "$verification_dir"
      - name: Verify updater signatures with the embedded application public key
        run: |
          for package in "$RELEASE_VERIFICATION_DIR"/*.app.tar.gz "$RELEASE_VERIFICATION_DIR"/*.exe "$RELEASE_VERIFICATION_DIR"/*.deb; do
            cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example verify-updater -- "$package" "$package.sig"
          done
      - name: Upload asset verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定 v4
        with:
          name: published-asset-verification
          path: ${{ env.RELEASE_VERIFICATION_DIR }}/verification-summary.json
          if-no-files-found: error

  publish-update-index:
    needs: [verify-published-assets]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定 v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # 固定 v5
        with:
          node-version: "22"
      - name: Publish verified release index
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-update-index.mjs --publish
