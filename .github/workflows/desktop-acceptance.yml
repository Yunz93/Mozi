name: Desktop acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/desktop/**"
      - "package*.json"
      - "index.*"
      - "vite.config.*"
      - ".github/workflows/desktop-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/desktop/**"
      - "package*.json"
      - "index.*"
      - "vite.config.*"
      - ".github/workflows/desktop-acceptance.yml"
  workflow_dispatch:
    inputs:
      performance:
        description: "Performance matrix: smoke or all note/window counts"
        type: choice
        default: full
        options: [smoke, full]
      include_intel:
        description: "Also validate the optional, currently unshipped Intel macOS build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.include_intel && '["ubuntu-24.04","macos-15","macos-15-intel","windows-2025"]' || '["ubuntu-24.04","macos-15","windows-2025"]') }}
    concurrency:
      group: desktop-platform-${{ github.event.pull_request.number || github.ref }}-${{ matrix.runner }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      MOZI_DESKTOP_SUITE: full
      MOZI_DESKTOP_PERFORMANCE: ${{ inputs.performance || 'smoke' }}
      MOZI_DESKTOP_OUTPUT: .perf/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: desktop-${{ matrix.runner }}
          cache-on-failure: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11 openbox fonts-noto-cjk
      - run: npm ci
      - name: Test profile safety and protocol error handling
        run: node --test scripts/desktop/safety.test.mjs
      - name: Check test/release boundary
        run: node scripts/desktop/check-boundary.mjs
      - name: Restore Windows NSIS tool cache
        if: runner.os == 'Windows'
        id: nsis_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: nsis-${{ runner.os }}-${{ runner.arch }}-3.11-utils-0.5.3-v1
      - name: Fetch and verify Windows packaging tools through the Release API
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -File scripts/desktop/prepare-nsis.ps1
      - name: Build isolated macOS automation app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --features desktop-e2e --bundles app --no-sign --config src-tauri/tauri.desktop-e2e.conf.json
      - name: Build isolated Linux automation app
        if: runner.os == 'Linux'
        run: npm run tauri -- build --features desktop-e2e --no-bundle --no-sign --config src-tauri/tauri.desktop-e2e.conf.json
      - name: macOS desktop acceptance
        if: runner.os == 'macOS'
        env:
          MOZI_DESKTOP_BINARY: src-tauri/target/release/bundle/macos/Mozi Desktop E2E.app/Contents/MacOS/mozi-desktop-e2e
        run: node scripts/desktop/run.mjs
      - name: Linux desktop acceptance
        if: runner.os == 'Linux'
        env:
          MOZI_DESKTOP_BINARY: src-tauri/target/release/mozi-desktop-e2e
        run: sh scripts/desktop/run-linux.sh
      - name: Build Windows release-configuration installer
        if: runner.os == 'Windows'
        run: node scripts/desktop/build-windows.mjs
      - name: Install Windows application and select WebView2 runtime
        if: runner.os == 'Windows'
        run: pwsh -File scripts/desktop/prepare-windows.ps1
      - name: Launch installed Windows stock app and verify driver exclusion
        if: runner.os == 'Windows'
        run: node scripts/desktop/windows-stock.mjs
      - name: Build isolated Windows automation app with the same frontend assets
        if: runner.os == 'Windows'
        run: npm run tauri -- build --features desktop-e2e --no-bundle --no-sign --config src-tauri/tauri.desktop-e2e.conf.json --config '{"build":{"beforeBuildCommand":""}}'
      - name: Windows desktop acceptance
        if: runner.os == 'Windows'
        env:
          MOZI_DESKTOP_BINARY: src-tauri/target/release/mozi-desktop-e2e.exe
        run: node scripts/desktop/run.mjs
      - name: Build macOS stock release-configuration application
        if: runner.os == 'macOS'
        # Reuse exactly the frontend assets exercised by the isolated app.
        run: npm run tauri -- build --bundles app --no-sign --config src-tauri/tauri.desktop-smoke.conf.json --config '{"build":{"beforeBuildCommand":""}}'
      - name: Launch macOS stock application and verify driver exclusion
        if: runner.os == 'macOS'
        run: node scripts/desktop/macos-stock.mjs
      - name: Upload desktop evidence (never profiles or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: .perf/desktop
          include-hidden-files: true
          if-no-files-found: warn
      - name: Save verified Windows NSIS tool cache even after test failures
        if: always() && runner.os == 'Windows' && steps.nsis_cache.outputs.cache-hit != 'true' && steps.nsis_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ steps.nsis_cache.outputs.cache-primary-key }}
